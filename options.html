<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amp sidebar right settings</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 24px; max-width: 36rem; font: 14px/1.5 system-ui, sans-serif; color: CanvasText; background: Canvas; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: flex; align-items: center; gap: 10px; padding-block: 8px; cursor: pointer; font-weight: 600; }
  input { width: 18px; height: 18px; margin: 0; }
  input:focus-visible { outline: 2px solid Highlight; outline-offset: 3px; }
  p { margin: 8px 0; }
  #status { min-height: 1.5em; }
</style>
<h1>Amp sidebar right</h1>
<label><input id="enabled" type="checkbox" checked disabled aria-describedby="description">Enable extension behavior</label>
<p id="description">Move the sidebar, reposition auxiliary views, indent child threads, and show the optional subagent panel. Turn this off to restore Amp’s native layout and resizing.</p>
<p>Your sidebar side and width are remembered. Changes apply immediately to open Amp tabs.</p>
<p id="status" role="status">Loading settings…</p>
<script src="options.js"></script>
</html>
