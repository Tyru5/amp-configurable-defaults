<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amp sidebar compatibility fixture</title>
<style>
  /* Composer stand-in: Attachments region and trigger structure from Amp's 4b22e4d9.js, inspected 2026-10-26. */
  .fixture-composer { margin: 8px 12px; border: 1px solid #80808060; border-radius: 12px; font: 13px system-ui, sans-serif; }
  .fixture-composer-input { padding: 10px 12px; color: GrayText; }
  .fixture-composer-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 8px 8px; }
  .fixture-composer-toolbar [role="region"] { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .fixture-composer-toolbar button { border: 0; background: none; font-size: 15px; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px system-ui, sans-serif; color: #20231f; background: #fafaf8; }
  .test-controls { height: 64px; padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #ddd; }
  .test-controls span { margin-right: auto; color: #666; font-size: 13px; }
  button { font: inherit; padding: 7px 12px; border: 1px solid #ccc; border-radius: 6px; color: inherit; background: white; cursor: pointer; }
  button:hover { background: #eaece6; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid #426dba; outline-offset: 2px; }
  .app-frame-stack { display: flex; height: calc(100dvh - 64px); }
  .app-primary-navigation { width: 56px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 16px; background: #eeefe9; }
  .app-primary-navigation strong { font-size: 22px; color: #ba4829; }
  .app-frame { display: flex; min-width: 0; flex: 1; }
  .app-content-frame { display: flex; position: relative; flex: 1; min-width: 0; overflow: hidden; --input-border: #ddd; }
  [data-slot="sidebar"] { flex-shrink: 0; }
  [data-slot="sidebar-gap"] { width: var(--sidebar-width); height: 100%; }
  [data-slot="sidebar-container"] { position: absolute; inset-block: 0; left: 0; width: var(--sidebar-width); background: #f4f5f0; border-right: 1px solid #ddd; }
  [data-slot="sidebar-inner"] { height: 100%; display: flex; flex-direction: column; }
  .sidebar-toolbar { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px 0 46px; border-bottom: 1px solid #ddd; font-weight: 600; }
  .sidebar-body { padding: 18px 10px; flex: 1; min-height: 0; overflow: auto; }
  .sidebar-body p { margin: 0 10px 20px; color: #6b6d67; font-size: 13px; }
  .sidebar-body button { width: 100%; text-align: left; background: transparent; border: 0; margin-bottom: 6px; }
  .sidebar-body button:first-of-type { background: #e5e8df; }
  .sidebar-body ul { list-style: none; padding: 0; margin: 0; }
  .sidebar-body li { position: relative; }
  .sidebar-body a { display: flex; gap: 6px; padding: 8px; color: inherit; text-decoration: none; border-radius: 6px; }
  .sidebar-body a:hover, .sidebar-body a:focus-visible { background: #e5e8df; }
  .sidebar-body [data-thread-row-nesting-depth] { width: 12px; flex-shrink: 0; }
  [data-thread-list-hover-card] { position: fixed; left: 0; top: 0; z-index: 50; width: 320px; padding: 12px; border-radius: 6px; background: white; box-shadow: 0 4px 20px #0003; }
  .account { padding: 18px; margin-top: auto; border-top: 1px solid #ddd; color: #62665c; }
  [data-slot="sidebar-inset"] { flex: 1; min-width: 0; display: flex; flex-direction: column; background: white; }
  .thread-layout-panes { height: 100%; min-height: 0; }
  .thread-workspace { height: 100%; display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
  .title-bar { display: flex; align-items: center; flex-shrink: 0; height: 52px; padding: 0 18px; border-bottom: 1px solid #eee; font-weight: 600; }
  .title-bar > span { margin-right: auto; }
  [data-thread-transcript-scroll] { padding: 12px; }
  [data-transcript-subagent], [data-transcript-automation-event] { margin: 12px; padding: 10px; border: 1px solid #ddd; }
  [data-transcript-expandable-row] { cursor: pointer; }
  [data-transcript-expandable-row] > div { display: flex; gap: 8px; }
  [data-transcript-subagent-prompt], [data-transcript-subagent-response], [data-transcript-subagent-error] { white-space: pre-wrap; margin-top: 10px; }
  article { width: min(700px, 100%); padding: 42px 40px; margin: auto; line-height: 1.7; }
  article h1 { font-size: 27px; font-weight: 600; line-height: 1.3; }
  article small { color: #6d7568; }
  textarea { font: inherit; width: 100%; margin-top: 32px; padding: 16px; border: 1px solid #ccc; border-radius: 12px; resize: vertical; }
  #view-group { display: flex; flex: 1; min-height: 0; }
  #view-group > [data-pane] { min-width: 0; overflow: auto; }
  [data-pane-resizer] { width: 4px; flex-shrink: 0; background: #ddd; cursor: ew-resize; touch-action: none; }
  #view-pane { background: #f4f5f0; }
  #view-pane > * { margin: 20px; }
  .sidebar-trigger-wrapper { position: absolute; top: 8px; left: 6px; z-index: 30; }
  .sidebar-trigger-wrapper button { padding: 4px 8px; }
  .resize-handle { position: absolute; inset-block: 0; width: 5px; left: calc(var(--sidebar-width) - 1px); transform: translateX(-4px); cursor: ew-resize; z-index: 30; }
  .resize-handle:hover { background: #7c8b6c; }
  [data-state="collapsed"] [data-slot="sidebar-gap"] { width: 0; }
  [data-collapsible="offcanvas"][data-slot="sidebar-container"] { left: calc(-1 * var(--sidebar-width)); }
  .app-sidebar-closed .title-bar { padding-left: 52px; }
  @media (max-width: 767px) {
    .app-primary-navigation, [data-slot="sidebar"], .resize-handle { display: none; }
    .test-controls { height: auto; flex-wrap: wrap; }
    .test-controls span { width: 100%; }
    .sidebar-trigger-wrapper { display: none; }
    article { padding: 20px; }
  }
</style>
<link rel="stylesheet" href="../sidebar.css">
<div class="test-controls">
  <span>Local compatibility fixture · Not live Amp · 1280 × 800</span>
  <label>Views <select id="view"><option value="">Closed</option><option>Files</option><option>Changes</option><option>Portal</option><option>Terminal</option><option>Desktop</option></select></label>
  <button id="replace">Replace app shell</button>
  <button id="switch">Switch sidebar side</button>
</div>
<div id="mount"></div>
<template id="shell">
  <div class="app-frame-stack app-frame-stack-rail">
    <nav class="app-primary-navigation" aria-label="App navigation"><strong>A</strong><span>Code</span><span>Feed</span></nav>
    <div class="app-frame">
      <div class="app-content-frame" data-slot="sidebar-wrapper" style="--sidebar-width: 300px">
        <div class="sidebar-trigger-wrapper"><button aria-label="Toggle sidebar" aria-expanded="true">☰</button></div>
        <div data-slot="sidebar" data-state="expanded" data-side="left">
          <div data-slot="sidebar-gap"></div>
          <aside class="app-navigation-sidebar" data-slot="sidebar-container" aria-label="Threads">
            <div data-slot="sidebar-inner">
              <div class="sidebar-toolbar">Threads</div>
              <div class="sidebar-body"><p>WORKSPACE</p>
                <ul>
                  <li data-slot="sidebar-menu-item" id="thread-parent"><a data-sidebar-thread-id="parent" href="#parent">Release preparation</a></li>
                  <li data-slot="sidebar-menu-item" id="thread-child"><a data-sidebar-thread-id="child" href="#child"><span data-thread-row-nesting-depth="1" aria-hidden="true"></span>Package extension</a></li>
                  <li data-slot="sidebar-menu-item" id="thread-grandchild"><a data-sidebar-thread-id="grandchild" href="#grandchild"><span data-thread-row-nesting-depth="2" aria-hidden="true"></span>Verify package</a></li>
                  <li data-slot="sidebar-menu-item" id="thread-other"><a data-sidebar-thread-id="other" href="#other">Platform investigation</a></li>
                </ul><p>Archived</p>
              </div>
              <div data-slot="sidebar-footer" class="account">
                <nav aria-label="Footer navigation"><a href="#puck">Puck</a> <a href="#activity">Activity</a> <a href="#projects">Projects</a> <button aria-label="All apps">▦</button></nav>
                <div><a href="#pinned">Pinned project</a></div>
                <button aria-label="Account">Your workspace</button>
              </div>
            </div>
          </aside>
        </div>
        <div class="resize-handle" role="separator" aria-label="Resize sidebar"></div>
        <main data-slot="sidebar-inset">
          <div class="thread-layout-panes"><div class="thread-workspace">
          <div class="thread-title-bar-container"><div class="title-bar app-title-bar"><span>Camera identification initiative</span></div></div>
          <div id="view-group" class="thread-file-tab-pane-group" data-pane-group data-direction="horizontal" style="flex-direction: row">
            <div id="agent-pane" data-pane style="flex: 68 1 0px">
              <article><small>COMPATIBILITY PREVIEW</small><h1>Your conversation stays put.<br>The sidebar switches sides.</h1><p>This local fixture exercises the extension using the sidebar wrapper, container, gap, and resize divider found in Amp's published app assets.</p><p>The extension changes layout styles without moving app nodes or changing thread data. The test control above changes the same placement preference as the extension settings.</p><label for="message">Message</label><textarea id="message" rows="3" placeholder="Your composer remains editable"></textarea></article>
              <div class="thread-chat-scroll-region"><div data-thread-transcript-scroll data-thread-id="fixture-a"><div data-thread-transcript-content id="fixture-transcript"></div></div></div>
              <div data-thread-composer-footer><div data-message-composer-root class="fixture-composer"><div class="fixture-composer-input">Message the agent…</div><div class="fixture-composer-toolbar"><div role="region" aria-label="Attachments"><span class="relative inline-flex shrink-0 border border-transparent"><button type="button" aria-label="Add images and files">📎</button><input type="file" multiple="" tabindex="-1" aria-hidden="true" hidden></span><!----></div><button type="button" class="fixture-send" aria-label="Send">↑</button></div></div></div>
            </div>
            <div data-pane-resizer data-slot="resizable-handle" role="separator" aria-label="Resize views" tabindex="0" hidden></div>
            <section id="view-pane" data-pane style="flex: 32 1 0px" hidden><h2 id="view-title">Files</h2><p>Local fixture view content, not a live executor.</p></section>
          </div>
          </div></div>
        </main>
      </div>
    </div>
  </div>
</template>
<script>
  // Shapes of /threads/<id>/__data results, from Amp's thread route loader and
  // its mode/runner display helpers, inspected 2026-10-26. Fixture values only.
  window.fixtureThreadData = {
    'fixture-a': { type: 'result', transcriptPage: { messages: [
      { role: 'assistant', usage: { model: 'claude-sonnet-5' } },
      { role: 'assistant', usage: { model: 'claude-opus-5-5' } },
      { role: 'assistant', parentToolUseId: 'toolu_sub', usage: { model: 'claude-haiku-5-5' } },
      { role: 'user' },
    ] }, thread: { id: 'fixture-a', agentMode: 'high', meta: { executorType: 'local-client' },
      env: { initial: { runnerID: 'tiru5-macbook-pro', hostname: 'Tyrus-MBP.local', trees: [{ uri: 'file:///Users/tiru5/My%20Repo', repository: { dir: 'app' } }] } } } },
    'fixture-b': { type: 'result', transcriptPage: { messages: [] },
      thread: { id: 'fixture-b', agentMode: 'medium', meta: { executorType: 'sandbox' } } },
    'fixture-c': { type: 'result', transcriptPage: { messages: [{ role: 'assistant', usage: { model: 'claude-opus-5' } }] },
      thread: { id: 'fixture-c', agentMode: 'external-agent:claude-code', meta: { executorType: 'local-client', features: ['model:claude-sonnet-5-5', 'effort:xhigh'] },
        env: { initial: { runnerID: '0f8fad5b-d9cb-469f-a165-70867728950e', hostname: 'build-box', workingDirectory: 'file:///srv/my%20work' } } } },
  };
  window.fixtureThreadRequests = [];
  const nativeFetch = window.fetch;
  window.fetch = async (input, init) => {
    const match = String(input).match(/^\/threads\/([^/]+)\/__data$/);
    if (!match) return nativeFetch(input, init);
    const id = decodeURIComponent(match[1]);
    fixtureThreadRequests.push({ id, credentials: init?.credentials });
    const data = fixtureThreadData[id];
    return new Response(data ? JSON.stringify(data) : 'missing', { status: data ? 200 : 500 });
  };
  const listeners = [];
  window.chrome = {
    storage: {
      local: {
        async get() { return JSON.parse(localStorage.getItem('extension-settings') || '{}'); },
        async set(values) {
          const before = await this.get();
          localStorage.setItem('extension-settings', JSON.stringify({ ...before, ...values }));
          const changes = Object.fromEntries(Object.entries(values).map(([key, value]) => [key, { oldValue: before[key], newValue: value }]));
          listeners.forEach(fn => fn(changes, 'local'));
        }
      },
      onChanged: { addListener(fn) { listeners.push(fn); } }
    },
    action: {
      async setBadgeText({ text }) { document.querySelector('#switch').textContent = `Switch sidebar side · ${text}`; },
      async setBadgeBackgroundColor() {},
      async setTitle() {}
    }
  };
  addEventListener('storage', event => {
    if (event.key !== 'extension-settings') return;
    const before = JSON.parse(event.oldValue || '{}');
    const after = JSON.parse(event.newValue || '{}');
    const changes = Object.fromEntries([...new Set([...Object.keys(before), ...Object.keys(after)])].filter(key => before[key] !== after[key]).map(key => [key, { newValue: after[key] }]));
    listeners.forEach(fn => fn(changes, 'local'));
  });
  function mount() {
    document.querySelector('#mount').replaceChildren(document.querySelector('#shell').content.cloneNode(true));
    const group = document.querySelector('.thread-file-tab-pane-group');
    const handle = group.querySelector('[data-pane-resizer]');
    let drag;
    const setSize = size => {
      const clamped = Math.max(20, Math.min(80, size));
      document.querySelector('#agent-pane').style.flexGrow = clamped;
      document.querySelector('#view-pane').style.flexGrow = 100 - clamped;
    };
    // Amp's native pane library uses physical cursor deltas and DOM pane order.
    handle.onmousedown = event => {
      event.preventDefault();
      drag = { x: event.clientX, size: parseFloat(document.querySelector('#agent-pane').style.flexGrow) };
    };
    document.body.onmousemove = event => {
      if (drag) setSize(drag.size + (event.clientX - drag.x) / group.clientWidth * 100);
    };
    window.onmouseup = () => { drag = null; };
    handle.onkeydown = event => {
      if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
      event.preventDefault();
      setSize(parseFloat(document.querySelector('#agent-pane').style.flexGrow) + (event.key === 'ArrowRight' ? 10 : -10));
    };
    document.querySelector('[aria-label="Toggle sidebar"]').onclick = event => {
      const state = document.querySelector('[data-slot="sidebar"]');
      const collapsed = state.dataset.state !== 'collapsed';
      state.dataset.state = collapsed ? 'collapsed' : 'expanded';
      document.querySelector('[data-slot="sidebar-container"]').dataset.collapsible = collapsed ? 'offcanvas' : '';
      document.querySelector('.app-content-frame').classList.toggle('app-sidebar-closed', collapsed);
      document.querySelector('.resize-handle').hidden = collapsed;
      event.currentTarget.setAttribute('aria-expanded', !collapsed);
    };
    document.querySelector('#view').onchange();
  }
  document.querySelector('#view').onchange = event => {
    const name = document.querySelector('#view').value;
    document.querySelector('#view-pane').hidden = !name;
    document.querySelector('[data-pane-resizer]').hidden = !name;
    document.querySelector('#view-title').textContent = name;
  };
  mount();
  document.querySelector('#replace').onclick = mount;
  document.querySelector('#switch').onclick = async () => {
    const { right = true } = await chrome.storage.local.get();
    await chrome.storage.local.set({ right: !right });
  };

  // Representative native markers verified against real Task runs in Helium.
  const agents = new Map();
  window.fixtureAgents = {
    add(id, title, task, status = 'running', output = '') {
      const model = { id, title, task, status, output };
      agents.set(id, model);
      this.render(model);
    },
    update(id, status, output) {
      Object.assign(agents.get(id), { status, output });
      this.render(agents.get(id));
    },
    render(model) {
      const row = document.createElement('div');
      row.id = `fixture-agent-${model.id}`;
      row.dataset.transcriptMessageLookupId = model.id;
      const card = document.createElement('div');
      card.dataset.transcriptSubagent = '';
      const wrapper = document.createElement('div');
      const header = document.createElement('div');
      header.dataset.transcriptExpandableRow = '';
      header.tabIndex = -1;
      const labels = document.createElement('div');
      const phase = document.createElement('span');
      phase.textContent = model.status === 'delegated' ? 'Delegated to subagent' : model.status === 'running' ? 'Subagent working' : 'Subagent finished';
      const name = document.createElement('span');
      name.textContent = model.title;
      labels.append(phase, name);
      if (model.status === 'running') {
        const working = document.createElement('span');
        working.dataset.transcriptSubagentWorking = '';
        working.setAttribute('aria-hidden', 'true');
        labels.prepend(working);
      }
      if (model.status === 'cancelled') {
        const cancelled = document.createElement('span');
        cancelled.dataset.transcriptToolStatus = 'cancelled';
        labels.append(cancelled);
      }
      const chevron = document.createElement('span');
      chevron.className = 'expandable-row-chevron';
      header.append(labels, chevron);
      header.onclick = () => {
        if (chevron.classList.toggle('rotate-90')) {
          const detail = document.createElement('div');
          if (model.status === 'running' || model.status === 'delegated') {
            detail.dataset.transcriptSubagentPrompt = '';
            detail.textContent = model.task;
          } else if (model.status === 'failed') {
            detail.dataset.transcriptSubagentError = '';
            detail.textContent = model.output;
          } else if (model.status !== 'cancelled') {
            detail.dataset.transcriptSubagentResponse = '';
            detail.textContent = model.output;
          }
          wrapper.append(detail);
        } else wrapper.lastElementChild.remove();
      };
      wrapper.append(header);
      card.append(wrapper);
      row.append(card);
      const previous = document.getElementById(row.id);
      if (previous) previous.replaceWith(row);
      else document.querySelector('#fixture-transcript').append(row);
    },
    complete(id, output, failed = false) {
      const model = agents.get(id);
      const event = document.createElement('div');
      event.dataset.transcriptAutomationEvent = 'subagent';
      const header = document.createElement('div');
      header.dataset.transcriptExpandableRow = '';
      const phase = document.createElement('span');
      phase.dataset.transcriptAutomationEventLabel = '';
      phase.textContent = failed ? 'Subagent failed:' : 'Subagent finished:';
      const link = document.createElement('a');
      link.dataset.transcriptAutomationEventSource = '';
      link.href = `#tool:${id}`;
      link.textContent = model.title;
      const chevron = document.createElement('span');
      chevron.className = 'expandable-row-chevron';
      header.append(phase, link, chevron);
      header.onclick = () => {
        if (chevron.classList.toggle('rotate-90')) {
          const result = document.createElement('div');
          result.dataset.transcriptAutomationEventMarkdown = '';
          result.textContent = output;
          event.append(result);
        } else event.lastElementChild.remove();
      };
      event.append(header);
      document.querySelector('#fixture-transcript').append(event);
    },
    navigate(id) {
      document.querySelector('[data-thread-transcript-scroll]').dataset.threadId = id;
      document.querySelector('#fixture-transcript').replaceChildren();
      agents.clear();
    }
  };
</script>
<script src="../background.js"></script>
<script src="../content.js"></script>

<script>
  // Native hover contract from Amp's b1575130.js, inspected 2026-10-24.
  // Fixture content only. In particular, preserve the native overflow-close guard.
  let hoverAnchor, hoverCard, hoverTimer, hoverFrame;
  function closeHover() {
    clearTimeout(hoverTimer);
    cancelAnimationFrame(hoverFrame);
    hoverCard?.remove();
    hoverCard = hoverAnchor = null;
  }
  function placeHover() {
    if (!hoverAnchor?.isConnected) return closeHover();
    const rect = hoverAnchor.getBoundingClientRect();
    const touch = hoverAnchor.hasAttribute('data-sidebar-touch-preview');
    const x = rect.right + 5;
    const maxX = innerWidth - hoverCard.offsetWidth - 8;
    if (!touch && x > maxX) return closeHover();
    const left = Math.min(touch ? Math.max(8, rect.left) : x, Math.max(8, maxX));
    const top = Math.min(touch ? rect.bottom + 5 : rect.top, Math.max(8, innerHeight - hoverCard.offsetHeight - 8));
    hoverCard.style.transform = `translate3d(${left}px, ${top}px, 0)`;
    hoverFrame = requestAnimationFrame(placeHover);
  }
  function openHover(anchor) {
    closeHover();
    hoverAnchor = anchor;
    hoverCard = document.createElement('div');
    hoverCard.setAttribute('data-thread-list-hover-card', '');
    hoverCard.setAttribute('role', 'tooltip');
    const title = document.createElement('strong');
    title.setAttribute('data-thread-hover-card-title', '');
    title.textContent = anchor.textContent;
    const detail = document.createElement('p');
    detail.textContent = 'Local hover fixture · Updated just now';
    const link = document.createElement('a');
    link.href = '#hover-details';
    link.textContent = 'View thread details';
    hoverCard.append(title, detail, link);
    document.body.append(hoverCard);
    placeHover();
  }
  document.addEventListener('pointerover', event => {
    if (event.pointerType !== 'mouse') return;
    const anchor = event.target.closest('[data-sidebar-thread-id]');
    if (!anchor || anchor === hoverAnchor) return;
    clearTimeout(hoverTimer);
    // Exercise native safe-triangle deferral as well as the initial open delay.
    hoverTimer = setTimeout(() => openHover(anchor), hoverCard ? 120 : 600);
  });
  document.addEventListener('pointerout', event => {
    const next = event.relatedTarget;
    if (next instanceof Element && next.closest('[data-sidebar-thread-id], [data-thread-list-hover-card]')) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(closeHover, 100);
  });
  document.addEventListener('focusin', event => {
    const anchor = event.target.closest('[data-sidebar-thread-id]');
    if (anchor && event.target.matches(':focus-visible')) openHover(anchor);
  });
  document.addEventListener('focusout', event => {
    if (!event.relatedTarget?.closest('[data-thread-list-hover-card]')) closeHover();
  });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeHover(); });
  document.addEventListener('pointerdown', event => {
    if (!event.target.closest('[data-thread-list-hover-card]')) closeHover();
  }, true);
  addEventListener('scroll', closeHover, true);
  addEventListener('resize', closeHover);
</script>
