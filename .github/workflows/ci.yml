name: Extension checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check background.js && node --check content.js && node --check subagents.js && node --check composer.js && node --check info-orb.js && node --check options.js && node --check docs/landing.js
      - run: node --test tests/background.test.mjs tests/options.test.mjs
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-package
          path: dist/*
